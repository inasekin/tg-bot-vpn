name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# Не запускать два деплоя одновременно; старый прогон на том же ref отменяется.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v4

      # python-version выставляет UV_PYTHON: без этого uv sync брал бы версию
      # из .python-version (3.11) во всех ячейках матрицы.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Check Python version
        run: uv run python -c "import sys; assert sys.version.startswith('${{ matrix.python-version }}'), sys.version"

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Format check with black
        run: uv run black --check .

      - name: Tests
        run: uv run pytest -v

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            if [ ! -d "/root/tg-bot-vpn" ]; then
              cd /root
              git clone https://github.com/inasekin/tg-bot-vpn
            fi
            cd /root/tg-bot-vpn
            git checkout -- .
            # uv.lock раньше был в .gitignore и мог остаться неотслеживаемым — иначе pull упадёт
            git ls-files --error-unmatch uv.lock >/dev/null 2>&1 || rm -f uv.lock
            git pull --ff-only origin main
            bash scripts/deploy.sh
